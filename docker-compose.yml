version: "3.9"

services:
  # ── AI Service ──────────────────────────────────────────────────────────────
  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./services/ai/.env
    environment:
      - DATA_MODE=${DATA_MODE:-seed}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
    volumes:
      # Hot-reload in development — comment out in production
      - ./services/ai:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Supabase (local dev) ─────────────────────────────────────────────────────
  # For local Supabase, use the official CLI:
  #   npx supabase start
  # See README.md for setup instructions.
  # The docker-compose only manages the AI service; Supabase CLI manages its own containers.
